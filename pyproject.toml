[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "hermes-audit"
version = "0.1.0"
description = "Offline, searchable audit reports for Hermes Agent sessions"
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
authors = [{name = "rezzaghi"}]

[project.scripts]
hermes-audit = "hermes_audit.__main__:main"

[tool.setuptools.packages.find]
include = ["hermes_audit*"]

[tool.setuptools.package-data]
hermes_audit = ["assets/*.css", "assets/*.js"]
